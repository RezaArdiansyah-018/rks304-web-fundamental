<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex h-screen text-slate-800">
  <nav class="w-64 bg-slate-900 text-white flex flex-col justify-between p-5">
    <div>
      <div class="text-xl font-bold text-indigo-400 mb-8 px-2">E-Store Admin</div>
      <ul class="space-y-2">
        <li><a href="dashboard.html" class="block px-4 py-2 rounded-lg hover:bg-slate-800">Dashboard</a></li>
        <li><a href="products.html" class="block px-4 py-2 rounded-lg bg-indigo-600">Products</a></li>
        <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-slate-800">Users</a></li>
        <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-slate-800">Setting</a></li>
      </ul>
    </div>
    <a href="index.html" class="block px-4 py-2 text-center bg-rose-600 rounded-lg hover:bg-rose-700 font-medium">Logout</a>
  </nav>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
      <span class="font-semibold text-slate-700">Panel Administrasi</span>
      <span class="text-sm text-slate-500">Halo, Admin</span>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Manajemen Produk</h1>
        <a href="add-produk.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">
          + Add Product
        </a>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-50 border-b border-slate-200 text-sm text-slate-600">
            <tr>
              <th class="py-3 px-4">No</th>
              <th class="py-3 px-4">Name</th>
              <th class="py-3 px-4">Stock</th>
              <th class="py-3 px-4">Action</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-200 text-sm">
            <tr>
              <td class="py-3 px-4">1</td>
              <td class="py-3 px-4 font-medium">Mechanical Keyboard RGB</td>
              <td class="py-3 px-4">25</td>
              <td class="py-3 px-4 space-x-2">
                <a href="edit-produk.html" class="text-amber-600 hover:underline font-medium">Edit</a>
                <button class="text-rose-600 hover:underline font-medium">Delete</button>
              </td>
            </tr>
            <tr>
              <td class="py-3 px-4">2</td>
              <td class="py-3 px-4 font-medium">Wireless Gaming Mouse</td>
              <td class="py-3 px-4">40</td>
              <td class="py-3 px-4 space-x-2">
                <a href="edit-produk.html" class="text-amber-600 hover:underline font-medium">Edit</a>
                <button class="text-rose-600 hover:underline font-medium">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer class="bg-white border-t px-6 py-3 text-center text-xs text-slate-500">
      &copy; 2026 E-Store Admin Template. All rights reserved.
    </footer>
  </div>
</body>
</html>
