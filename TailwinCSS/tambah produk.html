<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Produk - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex h-screen text-slate-800">
  <nav class="w-64 bg-slate-900 text-white flex flex-col justify-between p-5">
    <div>
      <div class="text-xl font-bold text-indigo-400 mb-8 px-2">E-Store Admin</div>
      <ul class="space-y-2">
        <li><a href="dashboard.html" class="block px-4 py-2 rounded-lg hover:bg-slate-800">Dashboard</a></li>
        <li><a href="products.html" class="block px-4 py-2 rounded-lg bg-indigo-600">Products</a></li>
        <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-slate-800">Users</a></li>
        <li><a href="#" class="block px-4 py-2 rounded-lg hover:bg-slate-800">Setting</a></li>
      </ul>
    </div>
    <a href="index.html" class="block px-4 py-2 text-center bg-rose-600 rounded-lg hover:bg-rose-700 font-medium">Logout</a>
  </nav>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
      <span class="font-semibold text-slate-700">Panel Administrasi</span>
      <span class="text-sm text-slate-500">Halo, Admin</span>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <h1 class="text-2xl font-bold mb-6">Add Produk</h1>

      <form action="products.html" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-lg space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
          <input type="text" required placeholder="Nama produk" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Stock</label>
          <input type="number" required placeholder="Jumlah stok" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
          <textarea rows="3" required placeholder="Deskripsi produk" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <button type="submit" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-indigo-700">
          Submit
        </button>
      </form>
    </main>

    <footer class="bg-white border-t px-6 py-3 text-center text-xs text-slate-500">
      &copy; 2026 E-Store Admin Template. All rights reserved.
    </footer>
  </div>
</body>
</html>
