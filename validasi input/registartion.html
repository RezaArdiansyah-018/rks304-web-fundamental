<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-200 my-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Registrasi Akun</h1>
      <p class="text-sm text-slate-500 mt-1">Lengkapi data diri Anda di bawah ini</p>
    </div>

    <form id="formRegister" action="dashboard.html" class="space-y-4" novalidate>
      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" id="username" name="username" placeholder="Minimal 3 karakter" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-username" class="text-xs text-rose-600 mt-1 hidden"></p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-password" class="text-xs text-rose-600 mt-1 hidden"></p>
      </div>

      <!-- Nama -->
      <div>
        <label for="nama" class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-nama" class="text-xs text-rose-600 mt-1 hidden"></p>
      </div>

      <!-- Tanggal Lahir -->
      <div>
        <label for="tgl_lahir" class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir</label>
        <input type="date" id="tgl_lahir" name="tgl_lahir" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-tgl_lahir" class="text-xs text-rose-600 mt-1 hidden"></p>
      </div>

      <!-- Alamat -->
      <div>
        <label for="alamat" class="block text-sm font-medium text-slate-700 mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="2" placeholder="Masukkan alamat lengkap" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <p id="err-alamat" class="text-xs text-rose-600 mt-1 hidden"></p>
      </div>

      <!-- Nomor Telepon -->
      <div>
        <label for="telpon" class="block text-sm font-medium text-slate-700 mb-1">Nomor Telepon</label>
        <input type="tel" id="telpon" name="telpon" placeholder="Contoh: 628123456789" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <p id="err-telpon" class="text-xs text-rose-600 mt-1 hidden"></p>
      </div>

      <!-- Tombol Submit -->
      <button type="submit" 
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
        Daftar Sekarang
      </button>

      <p class="text-center text-sm text-slate-500 mt-4">
        Sudah punya akun? <a href="index.html" class="text-indigo-600 hover:underline font-medium">Login di sini</a>
      </p>
    </form>
  </div>

  <!-- Memanggil file JavaScript Validasi -->
  <script src="validasi_input.js"></script>
</body>
</html>
